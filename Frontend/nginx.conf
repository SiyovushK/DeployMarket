server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass         http://backend:5218/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Critical: tell the backend the public host so uploaded file URLs
        # are built with the public domain, not the internal backend hostname.
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # Proxy uploaded files from backend static files
    location /uploads/ {
        proxy_pass         http://backend:5218/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # React SPA — always serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
